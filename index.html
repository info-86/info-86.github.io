
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello</title>

<!-- Free Font: Libre Baskerville -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #ffffff;
    color: #000000;
    font-family: "Libre Baskerville", Georgia, serif;
  }

  body {
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    min-height: 100vh;
    padding-top: 34px;
    padding-left: 20px;
    padding-right: 20px;
    text-align: center;
  }

  .hello {
    margin: 0 0 28px 0;
    font-size: 42px;
    font-weight: 400;
    line-height: 1.2;
  }

  .clock-wrap {
    width: 100%;
    text-align: center;
  }

  .clock {
    display: block;
    width: 360px;
    height: auto;
    margin: 0 auto;
  }

  .today {
    width: fit-content;
    max-width: 430px;
    margin: 34px auto 2px auto;
    text-align: left;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
  }

  .time-text {
    width: fit-content;
    max-width: 430px;
    margin: 0 auto;
    text-align: left;
    font-size: 20px;
    line-height: 1.45;
    font-weight: 400;
  }

  .time-text p {
    margin: 0;
  }

  @media (max-width: 600px) {
    .page {
      padding-top: 28px;
      padding-left: 18px;
      padding-right: 18px;
    }

    .hello {
      font-size: 34px;
      margin-bottom: 24px;
    }

    .clock {
      width: 300px;
    }

    .today {
      max-width: 330px;
      font-size: 20px;
      margin-top: 30px;
      margin-bottom: 2px;
    }

    .time-text {
      max-width: 330px;
      font-size: 18px;
      line-height: 1.45;
    }
  }
</style>
</head>

<body>

<main class="page">

  <!-- Top Greeting -->
  <h1 class="hello">Hello</h1>

  <!-- Analog Clock -->
  <div class="clock-wrap">
    <svg class="clock" viewBox="0 0 200 200" aria-label="Analog clock">

      <!-- Clock face -->
      <circle
        cx="100"
        cy="100"
        r="95"
        fill="white"
        stroke="black"
        stroke-width="0.5"
      />

      <!-- Clock numbers -->
      <g
        font-family="'Libre Baskerville', Georgia, serif"
        font-size="20"
        font-weight="700"
        fill="black"
        text-anchor="middle"
        dominant-baseline="middle"
      >
        <text x="100" y="28">12</text>
        <text x="172" y="102">3</text>
        <text x="100" y="178">6</text>
        <text x="28" y="102">9</text>
      </g>

      <!-- Clock hands -->
      <line
        id="hourHand"
        x1="100"
        y1="100"
        x2="100"
        y2="62"
        stroke="black"
        stroke-width="2.5"
        stroke-linecap="round"
      />

      <line
        id="minuteHand"
        x1="100"
        y1="100"
        x2="100"
        y2="45"
        stroke="black"
        stroke-width="2"
        stroke-linecap="round"
      />

      <line
        id="secondHand"
        x1="100"
        y1="105"
        x2="100"
        y2="35"
        stroke="black"
        stroke-width="1"
      />

      <!-- Center pivot -->
      <circle
        cx="100"
        cy="100"
        r="4"
        fill="black"
      />

    </svg>
  </div>

  <!-- Today title above poem -->
  <div class="today">Today</div>

  <!-- Poem -->
<!-- Poem -->
<section class="time-text" aria-label="Today statement">
  <p>
    Clock time is measurement.<br>
    Calendar time is organization.<br>
    Your time is your existence.
  </p>
</section>

</main>

<script>
  function updateAnalogClock() {
    const now = new Date();

    const seconds = now.getSeconds();
    const minutes = now.getMinutes();
    const hours = now.getHours() % 12;

    const secondDegrees = seconds * 6;
    const minuteDegrees = minutes * 6 + seconds * 0.1;
    const hourDegrees = hours * 30 + minutes * 0.5;

    document
      .getElementById("secondHand")
      .setAttribute("transform", `rotate(${secondDegrees} 100 100)`);

    document
      .getElementById("minuteHand")
      .setAttribute("transform", `rotate(${minuteDegrees} 100 100)`);

    document
      .getElementById("hourHand")
      .setAttribute("transform", `rotate(${hourDegrees} 100 100)`);
  }

  setInterval(updateAnalogClock, 1000);
  updateAnalogClock();
</script>

</body>
</html>
