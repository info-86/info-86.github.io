<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>In Between Rides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 0; background: white; font-family: 'Libre Baskerville', serif; }
  #greeting { text-align: center; font-size: 48px; margin-top: 40px; margin-bottom: 10px; }
  #poem { text-align: center; max-width: 480px; margin: 40px auto 20px auto; padding: 0 20px; }
  #poem h2 { font-size: 22px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 24px; }
  #poem p { font-size: 17px; line-height: 2; margin: 0 0 8px 0; }
  #poem .question { font-style: italic; margin-top: 20px; font-size: 18px; }
  #calculator { max-width: 480px; margin: 30px auto 60px auto; padding: 0 20px; text-align: center; }
  #calculator input[type="date"] { font-family: 'Libre Baskerville', serif; font-size: 16px; padding: 8px 12px; border: 1px solid black; background: white; margin-bottom: 12px; width: 100%; max-width: 300px; }
  #calculator button { font-family: 'Libre Baskerville', serif; font-size: 16px; padding: 8px 24px; border: 1px solid black; background: white; cursor: pointer; display: block; margin: 0 auto 24px auto; }
  #calculator button:hover { background: black; color: white; }
  #result { font-size: 17px; line-height: 1.8; display: none; }
  #result .hours-lived { font-size: 32px; font-weight: 700; display: block; margin: 10px 0; }
  #result .hours-remaining { font-size: 18px; display: block; margin: 10px 0; }
  #location-note { font-size: 13px; color: #777; margin-top: 8px; }
</style>
</head>
<body>

<div id="greeting">Hi there.</div>

<div style="text-align:center; width:100%;">
  <svg width="500" height="750" viewBox="0 0 200 200" style="display:block; margin:0 auto;">
    <circle cx="100" cy="100" r="95" fill="white" stroke="black" stroke-width="0.5"/>
    <g font-family="'Libre Baskerville', serif" font-size="20" fill="black" text-anchor="middle" dominant-baseline="middle">
      <text x="100" y="28">12</text>
      <text x="172" y="102">3</text>
      <text x="100" y="178">6</text>
      <text x="28" y="102">9</text>
    </g>
    <line id="hourHand" x1="100" y1="100" x2="100" y2="60" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
    <line id="minuteHand" x1="100" y1="100" x2="100" y2="45" stroke="black" stroke-width="2" stroke-linecap="round"/>
    <line id="secondHand" x1="100" y1="105" x2="100" y2="35" stroke="black" stroke-width="1"/>
    <circle cx="100" cy="100" r="4" fill="black"/>
  </svg>
</div>

<div id="poem">
  <h2>Today</h2>
  <p>Your lived hours is your time.</p>
  <p>Time is organism specific.</p>
  <p class="question">What hour are you on?</p>
</div>

<div id="calculator">
  <input type="date" id="dob" aria-label="Date of birth">
  <button onclick="calculate()">Calculate</button>
  <div id="location-note"></div>
  <div id="result">
    <span>You are on hour</span>
    <span class="hours-lived" id="hoursLived"></span>
    <span class="hours-remaining" id="hoursRemainingText"></span>
    <span id="percentText" style="font-size:15px; color:#555;"></span>
  </div>
</div>

<script>
const lifeExpectancy = {
  US: 78.5, GB: 81.3, CA: 82.3, AU: 83.4, NZ: 82.1,
  FR: 82.7, DE: 81.3, IT: 83.6, ES: 83.5, PT: 81.9,
  NL: 82.3, BE: 81.7, SE: 83.0, NO: 83.2, DK: 81.5,
  FI: 82.0, CH: 84.0, AT: 81.9, IE: 82.8, GR: 82.2,
  JP: 84.3, KR: 83.5, CN: 77.1, IN: 70.8, BR: 75.9,
  MX: 75.1, AR: 76.7, CL: 80.2, CO: 77.3, PE: 76.7,
  RU: 73.2, UA: 73.0, PL: 78.8, CZ: 79.3, HU: 76.7,
  RO: 75.6, BG: 75.0, HR: 78.5, SK: 77.8, SI: 81.5,
  ZA: 64.9, NG: 55.2, KE: 67.1, GH: 64.1, ET: 66.6,
  EG: 72.0, MA: 74.3, TN: 76.7, DZ: 77.1, LY: 73.6,
  SA: 75.8, AE: 78.0, IL: 83.0, TR: 77.7, IR: 76.7,
  IQ: 70.8, SY: 72.7, JO: 74.9, LB: 78.9, KW: 75.5,
  TH: 77.2, VN: 75.4, PH: 71.2, ID: 71.7, MY: 76.9,
  SG: 83.6, PK: 67.3, BD: 72.6, LK: 77.0, NP: 70.5,
  DEFAULT: 73.0
};
const greetings = {
  FR: "Bonjour", ES: "Hola", DE: "Hallo", IT: "Ciao",
  PT: "Olá", NL: "Hallo", SE: "Hej", NO: "Hei",
  DK: "Hej", JP: "こんにちは", CN: "你好",
  KR: "안녕하세요", RU: "Здравствуйте"
};
let userCountry = "DEFAULT";
let userCountryName = "your region";
async function initLocation() {
  try {
    const response = await fetch("https://ipapi.co/json/");
    const data = await response.json();
    userCountry = data.country_code || "DEFAULT";
    userCountryName = data.country_name || "your region";
    document.getElementById("greeting").textContent = greetings[userCountry] || "Hi there.";
    document.getElementById("location-note").textContent = "Using life expectancy data for " + userCountryName + ".";
  } catch (e) {
    document.getElementById("greeting").textContent = "Hi there.";
    document.getElementById("location-note").textContent = "Using global average life expectancy.";
  }
}
initLocation();
function updateAnalogClock() {
  const now = new Date();
  const seconds = now.getSeconds();
  const minutes = now.getMinutes();
  const hours = now.getHours() % 12;
  document.getElementById("secondHand").setAttribute("transform", "rotate(" + (seconds * 6) + " 100 100)");
  document.getElementById("minuteHand").setAttribute("transform", "rotate(" + (minutes * 6 + seconds * 0.1) + " 100 100)");
  document.getElementById("hourHand").setAttribute("transform", "rotate(" + (hours * 30 + minutes * 0.5) + " 100 100)");
}
setInterval(updateAnalogClock, 1000);
updateAnalogClock();
function calculate() {
  const dob = document.getElementById("dob").value;
  if (!dob) return;
  const lifeYears = lifeExpectancy[userCountry] || lifeExpectancy.DEFAULT;
  const totalHours = lifeYears * 365.25 * 24;
  const birth = new Date(dob);
  const now = new Date();
  const hoursLived = Math.floor((now - birth) / (1000 * 60 * 60));
  const hoursRemaining = Math.max(0, Math.floor(totalHours - hoursLived));
  const percent = Math.min(100, ((hoursLived / totalHours) * 100).toFixed(1));
  document.getElementById("hoursLived").textContent = hoursLived.toLocaleString();
  document.getElementById("hoursRemainingText").textContent = hoursRemaining > 0
    ? hoursRemaining.toLocaleString() + " hours remain based on " + lifeYears + " year life expectancy in " + userCountryName + "."
    : "You have outlived the " + lifeYears + " year estimate for " + userCountryName + ".";
  document.getElementById("percentText").textContent = percent + "% of " + Math.floor(totalHours).toLocaleString() + " total hours.";
  document.getElementById("result").style.display = "block";
}
</script>
</body>
</html>
