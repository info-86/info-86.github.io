<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hi there.</title>

<!-- Libre Baskerville -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    background: white;
    font-family: 'Libre Baskerville', serif;
  }

  #greeting {
    text-align: center;
    font-size: 48px;
    margin-top: 40px;
    margin-bottom: 10px;
  }
</style>
</head>

<body>

<!-- Greeting -->
<div id="greeting">Hi there.</div>

<!-- Clock -->
<div style="text-align:center; width:100%;">

  <svg width="500" height="750" viewBox="0 0 200 200"
       style="display:block; margin:0 auto;">

    <!-- Clock face -->
    <circle cx="100" cy="100" r="95"
            fill="white" stroke="black" stroke-width="0.5"/>

    <!-- Numbers -->
    <g
      font-family="'Libre Baskerville', serif"
      font-size="20"
      fill="black"
      text-anchor="middle"
      dominant-baseline="middle">
      <text x="100" y="28">12</text>
      <text x="172" y="102">3</text>
      <text x="100" y="178">6</text>
      <text x="28" y="102">9</text>
    </g>

    <!-- Hands -->
    <line id="hourHand" x1="100" y1="100" x2="100" y2="60"
          stroke="black" stroke-width="2.5" stroke-linecap="round"/>
    <line id="minuteHand" x1="100" y1="100" x2="100" y2="45"
          stroke="black" stroke-width="2" stroke-linecap="round"/>
    <line id="secondHand" x1="100" y1="105" x2="100" y2="35"
          stroke="black" stroke-width="1"/>

    <!-- Center pivot -->
    <circle cx="100" cy="100" r="4" fill="black"/>

  </svg>

</div>

<script>
/* CLOCK */
function updateAnalogClock() {
  const now = new Date();

  const seconds = now.getSeconds();
  const minutes = now.getMinutes();
  const hours = now.getHours() % 12;

  document.getElementById("secondHand")
    .setAttribute("transform", `rotate(${seconds * 6} 100 100)`);

  document.getElementById("minuteHand")
    .setAttribute("transform", `rotate(${minutes * 6 + seconds * 0.1} 100 100)`);

  document.getElementById("hourHand")
    .setAttribute("transform", `rotate(${hours * 30 + minutes * 0.5} 100 100)`);
}

setInterval(updateAnalogClock, 1000);
updateAnalogClock();

/* GREETING BY COUNTRY */
async function setGreetingByCountry() {
  try {
    const response = await fetch("https://ipapi.co/json/");
    const data = await response.json();

    const greetings = {
      FR: "Bonjour",
      ES: "Hola",
      DE: "Hallo",
      IT: "Ciao",
      PT: "Olá",
      NL: "Hallo",
      SE: "Hej",
      NO: "Hei",
      DK: "Hej",
      JP: "こんにちは",
      CN: "你好",
      KR: "안녕하세요",
      RU: "Здравствуйте"
    };

    const country = data.country_code;
    const greeting = greetings[country] || "Hello";

    document.getElementById("greeting").textContent = greeting;
  } catch (e) {
    document.getElementById("greeting").textContent = "Hello";
  }
}

setGreetingByCountry();
</script>

</body>
</html>
